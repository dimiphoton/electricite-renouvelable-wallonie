[project]
name = "renewables-wallonia"
version = "0.1.0"
description = "Renewable generation vs electricity load in Belgium, with a Wallonia production zoom."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cdsapi>=0.7.7",
    "netCDF4>=1.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "xarray>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
renewables-wallonia = "renewables_wallonia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
