# Paramètres du projet — rien d'opérationnel n'est codé en dur ailleurs.
# Période : 36 mois glissants (bornes inclusives, calendrier civil).

[period]
start = "2023-09-01"
end = "2026-08-31"

[elia]
base_url = "https://opendata.elia.be/api/explore/v2.1"
# Archives historiques (pas les jeux near real-time ods002 / ods086 / ods087).
load_dataset = "ods001"
solar_dataset = "ods032"
wind_dataset = "ods031"
# Taux de couverture : charge nationale uniquement.
coverage_region = "Belgium"
# Zoom production + météo.
zoom_region = "Wallonia"

[elia.regions]
# Valeurs du champ `region` dans les exports Elia.
solar = ["Belgium", "Wallonia"]
wind = ["Federal", "Flanders", "Wallonia"]

[copernicus]
dataset = "reanalysis-era5-single-levels"
variables = [
    "surface_solar_radiation_downwards",
    "10m_u_component_of_wind",
    "10m_v_component_of_wind",
]
# Bbox CDS : nord, ouest, sud, est (degrés). Moyenne spatiale ensuite, pas de SIG.
belgium_bbox = [51.55, 2.5, 49.45, 6.45]
wallonia_bbox = [50.82, 2.84, 49.45, 6.45]

[paths]
raw_dir = "data/raw"
processed_dir = "data/processed"
warehouse = "data/processed/warehouse.duckdb"
analysis_dir = "data/processed/analysis"

[display]
timezone = "Europe/Brussels"

# Seuils des 4 questions métier (SQL dans sql/analysis/).
[analysis]
# Pic de charge = quantile de load_mw (0.9 = 10 % des quarts d'heure les plus chargés).
peak_load_quantile = 0.9
# Rayonnement min (W/m²) pour la corrélation solaire « de jour » (les nuits à 0 gonfleraient r).
daytime_ssrd_w_m2 = 10.0
# Stress : charge haute et renouvelable bas (quantiles).
stress_load_quantile = 0.9
stress_renewable_quantile = 0.1
coverage_mid_threshold = 0.5
coverage_high_threshold = 1.0
